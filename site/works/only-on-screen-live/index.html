<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#121719">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self'; object-src 'none'; base-uri 'self'">
  <title>화면 속에만 있는 사람</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <canvas id="stage" width="1280" height="720" aria-label="관객과 실시간 먹빛 그림자"></canvas>
    <video id="video" playsinline muted hidden></video>
    <section id="entry" aria-label="전시 시작">
      <div class="entry-card">
        <h1>화면 속에만 있는 사람</h1>
        <button id="camera-start" class="primary" disabled>카메라로 시작</button>
        <div class="row">
          <button id="demo-start" disabled>샘플 영상 시연</button>
          <button id="fullscreen" disabled>전체화면</button>
          <button id="operator-open" disabled>운영 설정</button>
        </div>
        <p>카메라 영상과 인물 분리는 이 기기에서만 처리됩니다.</p>
        <p id="notice" role="status">전시 화면 준비 중</p>
      </div>
    </section>
    <div id="demo-mark" hidden>샘플 입력</div>
  </main>
  <aside id="operator" aria-label="전시 운영 설정" hidden>
    <header><h2>전시 운영</h2><button id="operator-close">닫기</button></header>
    <p id="state">입력 대기</p>
    <div class="row"><button id="reconnect">카메라 다시 연결</button><button id="stop">입력 중지</button><button id="operator-fullscreen">전체화면</button></div>
    <fieldset>
      <legend>입력과 성능</legend>
      <label>카메라<select id="device" data-setting="cameraId"><option value="">기본 카메라</option></select></label>
      <label>성능 모드<select data-setting="quality"><option value="auto">자동</option><option value="high">높음 · 3명</option><option value="medium">보통 · 2명</option><option value="low">낮음 · 1명</option></select></label>
      <label>분석 장치<select data-setting="delegate"><option value="CPU">CPU</option><option value="GPU">GPU 사용 가능 시</option></select></label>
      <label class="check"><input type="checkbox" data-setting="mirror"> 거울처럼 좌우 반전</label>
      <label class="check"><input type="checkbox" data-setting="cameraBackground"> 카메라 전체 배경 표시</label>
    </fieldset>
    <fieldset>
      <legend>그림자와 색감</legend>
      <label>인물당 그림자<select data-setting="shadows"><option>2</option><option>3</option><option>4</option></select></label>
      <label>그림자 강도<input type="range" data-setting="strength" min=".1" max="1" step=".05"></label>
      <label>그림자 기울기<input type="range" data-setting="spread" min=".4" max="1.45" step=".05"></label>
      <label>인물 명암<input type="range" data-setting="contrast" min=".7" max="1.6" step=".05"></label>
      <label>색감<select data-setting="tone"><option value="ink">먹빛</option><option value="paper">바랜 한지</option><option value="rust">탁한 적갈색</option></select></label>
      <label>윤곽 기준<input type="range" data-setting="threshold" min=".10" max=".35" step=".01"></label>
      <label class="check"><input type="checkbox" data-setting="sound"> 낮은 공간음</label>
      <label>음량<input type="range" data-setting="volume" min="0" max=".3" step=".02"></label>
    </fieldset>
    <fieldset>
      <legend>시연 입력</legend>
      <label>샘플<select id="sample"><option value="multi">세 사람 배치</option><option value="pose_1">한 사람</option><option value="dark">낮은 조도</option></select></label>
      <div class="row"><button id="sample-start">샘플 시작</button><button id="screen-only">화면만 표시</button></div>
      <label>이 PC의 테스트 영상<input id="local-file" type="file" accept="video/*"></label>
      <pre id="metrics">입력 대기</pre>
    </fieldset>
    <p class="help">D 운영 설정 · F 전체화면 · R 추적 초기화</p>
  </aside>
</body>
</html>
