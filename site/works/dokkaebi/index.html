<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b0a" />
    <title>귀면 도깨비 · 당신을 보는 영정</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css?v=2.3.0" />
  </head>
  <body class="drawing">
    <main id="exhibition" aria-label="귀면 도깨비 시선 인터랙티브">
      <div class="wall-grain" aria-hidden="true"></div>
      <div id="portraits">
      <figure id="memorial" class="memorial" data-position="center">
        <div class="frame">
          <div class="inner-frame">
            <div id="photograph" class="photograph">
              <img
                id="portrait"
                src="./assets/portrait-dokkaebi.webp"
                alt="통일신라 귀면무늬에서 착안한 도깨비 그림"
              /><canvas id="eyeLeft" aria-hidden="true"></canvas
              ><canvas id="eyeRight" aria-hidden="true"></canvas>
              <div class="photo-grain" aria-hidden="true"></div>
            </div>
          </div>
          <i class="ribbon ribbon-left" aria-hidden="true"></i
          ><i class="ribbon ribbon-right" aria-hidden="true"></i>
        </div>
        <figcaption>귀면 도깨비</figcaption>
      </figure>
      </div>
      <section id="startScreen" aria-label="작품 시작">
        <div class="start-content">
          <p class="eyebrow">당신을 보는 영정</p>
          <h1>귀면 도깨비</h1>
          <p class="start-hint">화면을 터치하거나 클릭하여 시작</p>
            <button id="startCamera" class="start-primary" disabled>전시 시작</button>
            <button id="cancelStart" hidden>카메라 시작 취소</button>
          <p class="permission-note">
            관객의 좌우 위치를 감지하기 위해<br />카메라 권한을 요청합니다.
          </p>
          <div class="start-options">
              <button id="startDemo" disabled>마우스 시연</button
            ><button id="startFullscreen">전체화면</button>
          </div>
            <p id="startupStatus" role="status">전시를 준비하고 있습니다.</p>
        </div>
      </section>
      <button
        id="operatorHandle"
        aria-label="전시 운영 설정"
        title="운영 설정 (D)"
      >
        ·
      </button>
      <div id="notice" role="status" hidden></div>
      <video id="camera" muted autoplay playsinline hidden></video>
      <aside id="operator" hidden aria-label="전시 운영 설정">
        <header>
          <h2>전시 운영</h2>
          <button id="closePanel" aria-label="운영 설정 닫기">닫기</button>
        </header>
        <dl id="statusValues"></dl>
        <fieldset>
          <legend>눈동자</legend>
          <label
            >반응 민감도
            <input
              data-setting="sensitivity"
              type="range"
              min="0.25"
              max="2.5"
              step="0.05" /><output id="sensitivityValue"></output></label
          ><label
            >따라보기 반응 시간 (초)<input
              data-setting="smoothing"
              type="range"
              min="0.04"
              max="1.2"
              step="0.02" /><output id="smoothingValue"></output></label
          ><label
            >최대 이동 (원본 px)<input
              data-setting="maxMovement" type="range" min="1" max="40"
              step="0.5" /><output id="maxMovementValue"></output></label
          ><label
            >사라진 뒤 유지 (초)<input
              data-setting="hold"
              type="range"
              min="0.2"
              max="3"
              step="0.1" /><output id="holdValue"></output></label
          ><label
            >정면 복귀 지연 (초)<input
              data-setting="returnTime"
              type="range"
              min="0.4"
              max="5"
              step="0.1" /><output id="returnTimeValue"></output></label
          ><button id="resetCenter">시선 정면 초기화</button
          ><button id="calibrateCenter">현재 관객을 중앙 기준으로</button>
        </fieldset>
        <fieldset>
          <legend>카메라·입력</legend>
            <p id="viewerHelp" class="help">처음 선택한 관객 한 명을 바라봅니다. 그 사람이 화면을 떠나면 다음 관객을 선택합니다.</p>
            <label>관객 선택
              <select data-setting="viewerPolicy">
                <option value="nearest">가까운 한 명</option>
                <option value="center">중앙에 있는 한 명</option>
              </select>
            </label>
            <label>최소 얼굴 너비 비율 · 전신은 자동 보완<input data-setting="viewerMinWidth" type="range" min="0.025" max="0.2" step="0.005"><output id="viewerMinWidthValue"></output></label>
          <label
            >카메라<select id="cameraSelect">
              <option value="">기본 카메라</option>
            </select></label
          ><button id="reconnect">카메라 연결/다시 연결</button
          ><button id="stopCamera">카메라 끄기</button
          ><label class="check"
            ><input data-setting="mirror" type="checkbox" />좌우 방향
            반전</label
          ><label class="check"
            ><input id="demoMode" type="checkbox" />마우스 시연 모드</label
          ><label class="check"
            ><input data-setting="autoDemo" type="checkbox" />카메라 오류 시
            마우스 시연</label
          ><label class="check"
            ><input data-setting="debug" type="checkbox" />카메라 추적 정보
            표시</label
          ><label
            >분석 횟수/초<input
              data-setting="fps"
              type="range"
              min="5"
              max="15"
              step="1" /><output id="fpsValue"></output></label
          ><canvas id="debugCanvas" width="320" height="180" hidden></canvas>
        </fieldset>
        <fieldset>
          <legend>전시</legend>
          <label class="check"
            ><input data-setting="sound" type="checkbox" />아주 낮은
            배경음</label
          ><button id="fullscreen">전체화면 전환 (F)</button
          ><button id="exportLog">검증 기록 저장</button
          ><button id="resetSettings">기본 설정 복원</button>
          <p class="help">
            D 운영 설정 · F 전체화면 · R 정면 초기화<br />설정은 이 브라우저에만
            저장됩니다.<br />카메라 영상은 외부로 전송하거나 저장하지 않습니다.
          </p>
        </fieldset>
      </aside>
    </main>
    <script src="./bootstrap.js?v=scene-polish" defer></script>
  </body>
</html>
