<!doctype html><html lang="ko"><meta charset="utf-8"><title>통합본 모델 경로 점검</title><style>body{font:16px/1.7 system-ui;background:#151619;color:#ddd;padding:30px}pre{white-space:pre-wrap}button{padding:12px}</style><h1>공용 AI 모델 경로 점검</h1><p>카메라 권한 없이 검은 시험 프레임만 사용합니다. 실제 관객 인식 검증이 아닙니다.</p><button id="run">모델 4종 실행 점검</button><pre id="report">대기</pre><script type="module">
const report=document.getElementById('report'),button=document.getElementById('run');
async function probe(id){return new Promise(resolve=>{const worker=new Worker(new URL('./works/'+id+'/'+(id==='portrait'?'tracking-worker.js':'vision-worker.js'),location.href)),started=performance.now();let frames=0,timer=setTimeout(()=>finish({pass:false,error:'timeout'}),90000),finished=false;
function finish(data){if(finished)return;finished=true;clearTimeout(timer);worker.terminate();resolve({work:id,frames,elapsed_ms:Math.round(performance.now()-started),...data});}
function frame(){const canvas=new OffscreenCanvas(320,240);canvas.getContext('2d').fillRect(0,0,320,240);const bitmap=canvas.transferToImageBitmap();worker.postMessage({type:'frame',bitmap,seq:frames,sourceMs:performance.now()},[bitmap]);}
worker.onerror=e=>finish({pass:false,error:e.message});worker.onmessage=({data:m})=>{if(m.type==='ready'){frame();}else if(m.type==='result'){frames++;if(frames<3)setTimeout(frame,90);else finish({pass:true});}else if(m.type==='error'||m.type==='frame-error')finish({pass:false,error:m.message});};worker.postMessage({type:'init',config:{sensitivity:.55},sensitivity:.55,delegate:'CPU'});});}
button.onclick=async()=>{button.disabled=true;const results=[];for(const id of ['wedding','portrait','only-on-screen','forbidden-broadcast']){report.textContent=JSON.stringify({running:id,results},null,2);results.push(await probe(id));}report.textContent=JSON.stringify({physicalCamera:false,pass:results.every(r=>r.pass),results},null,2);button.disabled=false;};
</script></html>
